name: Build a Nextjs Application
permissions:
  # Required for actions/upload-artifact in this reusable workflow.
  actions: write
  contents: read
  
on:
  workflow_call:
    inputs:
      workingDirectory:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: production
        description: "Vercel target environment (e.g. production, preview, dev or test)"
      generateStaticPaths:
        required: false
        type: boolean
        default: false
        description: "Whether to pre-generate static paths at build time (disable for editing host)"
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      NEXUS_NPM_AUTH:
        required: true
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

jobs:

  build:
    name: Build the NextJs Application
    runs-on: [ self-hosted-ubuntu ]
    container:
      #update image
      image: ""
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    env:
      GENERATE_STATIC_PATHS: ${{ inputs.generateStaticPaths }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js with Nexus NPM registry
      uses: ./.github/actions/setup-node-nexus
      with:
        nexus-npm-auth: ${{ secrets.NEXUS_NPM_AUTH }}
        registry-url: ${{ vars.NEXUS_NPM_REGISTRY }}
    - name: Cache Next.js build artifacts
      uses: actions/cache@v4
      with:
        path: apps/sitecore-rendering/.next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/sitecore-rendering/package.json') }}
        restore-keys: |
          nextjs-${{ runner.os }}-
    - name: Install Vercel CLI
      run: npm install -g vercel@50.26.1
    - name: Pull Vercel project settings
      run: vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}
    - name: Build Vercel prebuilt output
      run: vercel build ${{ inputs.environment == 'production' && '--prod' || format('--target={0}', inputs.environment) }} --token=${{ secrets.VERCEL_TOKEN }}
    - name: Upload prebuilt artifact (dev/test retention)
      if: inputs.environment == 'dev' || inputs.environment == 'test'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifactName }}
        retention-days: ${{ inputs.environment == 'dev' && 14 || 30 }}
        include-hidden-files: true
        if-no-files-found: error
        path: |
          .vercel/output
          apps/sitecore-rendering/.next
          apps/sitecore-rendering/.sitecore
    - name: Upload prebuilt artifact (default retention)
      if: inputs.environment != 'dev' && inputs.environment != 'test'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifactName }}
        include-hidden-files: true
        if-no-files-found: error
        path: |
          .vercel/output
          apps/sitecore-rendering/.next
          apps/sitecore-rendering/.sitecore