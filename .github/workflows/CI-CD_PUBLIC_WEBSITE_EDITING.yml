name: CI-CD - PUBLIC WEBSITE EDITING HOST
permissions:
  # Required because the called build/deploy reusable workflows upload and download artifacts.
  actions: write
  contents: read

on: 
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/CI-CD_PUBLIC_WEBSITE_EDITING.yml
      - .github/workflows/build_NextJs.yml
      - .github/workflows/deploy_vercel.yml
      - 'apps/sitecore-rendering/**'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'

jobs:

  build-editing-site:
    uses: ./.github/workflows/build_NextJs.yml
    with:
      workingDirectory: .
      artifactName: editing-website-prebuilt
      environment: dev
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      NEXUS_NPM_AUTH: ${{ secrets.NEXUS_NPM_AUTH }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.EDITING_VERCEL_PROJECT_ID }}

  deploy-editing-site:
    uses: ./.github/workflows/deploy_vercel.yml
    needs: build-editing-site
    if: needs.build-editing-site.result == 'success'
    with:
      artifactName: editing-website-prebuilt
      environment: dev
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.EDITING_VERCEL_PROJECT_ID }}