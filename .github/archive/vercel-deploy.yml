name: Deploy Editing Host to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # or your required version

      - name: Install dependencies
        run: npm install
        working-directory: .

      - name: Build Sitecore Content SDK Next.js app
        run: turbo run build content-sdk-nextjs
        working-directory: .

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_DEFAULT_SITE_NAME: ${{ vars.NEXT_PUBLIC_DEFAULT_SITE_NAME }}
          NEXT_PUBLIC_SITECORE_API_HOST: ${{ vars.NEXT_PUBLIC_SITECORE_API_HOST }}
          NEXT_PUBLIC_SITECORE_API_KEY: ${{ secrets.NEXT_PUBLIC_SITECORE_API_KEY }}
        run: |
            vercel deploy --token $VERCEL_TOKEN --yes --non-interactive --cwd . \
              -e NEXT_PUBLIC_DEFAULT_SITE_NAME=$NEXT_PUBLIC_DEFAULT_SITE_NAME \
              -e NEXT_PUBLIC_SITECORE_API_HOST=$NEXT_PUBLIC_SITECORE_API_HOST \
              -e NEXT_PUBLIC_SITECORE_API_KEY=$NEXT_PUBLIC_SITECORE_API_KEY
